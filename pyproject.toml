[project]
name = "churn-prediction-uplift"
version = "0.1.0"
description = "Churn propensity + survival (Kaplan-Meier/Cox) and uplift modeling with a campaign simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jusero1" }]
keywords = ["churn", "uplift", "survival-analysis", "retention", "machine-learning"]

dependencies = [
    "riskkit @ git+https://github.com/jusero1/riskkit@v0.1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "lifelines>=0.27",
    "matplotlib>=3.7",
    "kaggle>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbqa>=1.8",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_uplift"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"notebooks/*" = ["E501", "E702"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["X", "X_*", "T", "C"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["churn_uplift"]
branch = true
